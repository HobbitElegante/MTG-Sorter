name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # pytest-qt is installed via the dev extra and auto-loads Qt even though
      # we have no GUI tests; offscreen + disabling the plugin avoids CI crashes.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        # Entry point is "pytest-qt" (hyphen). "-p no:pytestqt" does NOT disable it
        # and left Qt loading on the headless runner → pytest INTERNALERROR (exit 3).
        run: uv run pytest -p no:pytest-qt -q --tb=short

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./scripts/build_linux.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/MTG-Sorter-*.AppImage
          if-no-files-found: error

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Build Windows package
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/MTG-Sorter-windows-x64.zip
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: ls -lah artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Release **${{ github.ref_name }}**.

            ### Downloads
            - **Linux:** `MTG-Sorter-*.AppImage` — mark executable (`chmod +x`) and run.
            - **Windows:** `MTG-Sorter-windows-x64.zip` — unzip and run `MTG-Sorter.exe`.

            Data (database + card images) is stored in the platform user-data folder. Override with `MTG_SORTER_DATA_DIR` if needed.

            See the [README](https://github.com/HobbitElegante/MTG-Sorter#readme) for features and first-time setup (Scryfall bulk download after install).
          files: |
            artifacts/MTG-Sorter-*.AppImage
            artifacts/MTG-Sorter-windows-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
