name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      # Do not auto-load pytest-qt (or any other entry-point plugins).
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        # Install pytest alone — skip the pytest-qt extra so Qt is never
        # auto-initialized on the headless runner (no GUI tests yet).
        run: |
          uv sync
          uv pip install pytest

      - name: Run tests
        run: uv run pytest -q --tb=short

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt runtime libs
        # PyInstaller imports PySide6 while analyzing; ubuntu-latest lacks libEGL.
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libdbus-1-3

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/build_linux.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/MTG-Rebuilder-*.AppImage
          if-no-files-found: error

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Build Windows package
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/MTG-Rebuilder-windows-x64.zip
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: ls -lah artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Release **${{ github.ref_name }}**.

            ### Downloads
            - **Linux:** `MTG-Rebuilder-*.AppImage` — mark executable (`chmod +x`) and run. Optional application-menu install (from a repo checkout): `./scripts/install_linux_desktop.sh /path/to/MTG-Rebuilder-*.AppImage`.
            - **Windows:** `MTG-Rebuilder-windows-x64.zip` — unzip and run `MTG-Rebuilder.exe`.

            Data (database + card images) is stored in the platform user-data folder. Override with `MTG_REBUILDER_DATA_DIR` if needed (legacy `MTG_SORTER_DATA_DIR` still accepted).

            See the [README](https://github.com/HobbitElegante/MTG-Rebuilder#readme) for features and first-time setup (Scryfall bulk download after install).
          files: |
            artifacts/MTG-Rebuilder-*.AppImage
            artifacts/MTG-Rebuilder-windows-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}